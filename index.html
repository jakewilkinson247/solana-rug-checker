<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Rug Checker</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0f1e3d 0%, #1a2f5a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: rgba(20, 30, 50, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 100, 200, 0.2);
            border: 1px solid rgba(100, 200, 255, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .title {
            font-size: 32px;
            color: #00d4ff;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .subtitle {
            color: #8899aa;
            font-size: 14px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid rgba(100, 200, 255, 0.3);
            border-radius: 10px;
            background: rgba(10, 20, 40, 0.8);
            color: #00d4ff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #00d4ff;
        }

        input::placeholder {
            color: rgba(100, 150, 200, 0.5);
        }

        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #00d4ff 0%, #0088ff 100%);
            color: #0a1428;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 212, 255, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .error {
            background: rgba(255, 60, 60, 0.2);
            border: 2px solid #ff3c3c;
            color: #ff6b6b;
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            color: #00d4ff;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-top: 2px solid #00d4ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .results {
            display: none;
        }

        .risk-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 12px;
            margin-bottom: 20px;
            text-align: center;
        }

        .risk-critical {
            background: rgba(255, 50, 50, 0.2);
            color: #ff3232;
            border: 1px solid #ff3232;
        }

        .risk-high {
            background: rgba(255, 100, 20, 0.2);
            color: #ff6414;
            border: 1px solid #ff6414;
        }

        .risk-medium {
            background: rgba(255, 180, 0, 0.2);
            color: #ffb400;
            border: 1px solid #ffb400;
        }

        .risk-caution {
            background: rgba(255, 230, 0, 0.2);
            color: #ffe600;
            border: 1px solid #ffe600;
        }

        .risk-low {
            background: rgba(50, 200, 100, 0.2);
            color: #32c864;
            border: 1px solid #32c864;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat {
            background: rgba(100, 200, 255, 0.1);
            padding: 16px;
            border-radius: 10px;
            border-left: 3px solid #00d4ff;
        }

        .stat-label {
            font-size: 11px;
            color: #8899aa;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 18px;
            color: #00d4ff;
            font-weight: 600;
        }

        .chart-container {
            background: rgba(10, 20, 40, 0.6);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(100, 200, 255, 0.1);
        }

        .holders-list {
            background: rgba(10, 20, 40, 0.6);
            border-radius: 10px;
            padding: 16px;
            border: 1px solid rgba(100, 200, 255, 0.1);
        }

        .holders-title {
            color: #00d4ff;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .holder-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(100, 200, 255, 0.1);
            font-size: 13px;
        }

        .holder-item:last-child {
            border-bottom: none;
        }

        .holder-address {
            color: #8899aa;
            font-family: 'Courier New', monospace;
            font-size: 11px;
        }

        .holder-percentage {
            color: #00d4ff;
            font-weight: 600;
            min-width: 50px;
            text-align: right;
        }

        .percentage-bar {
            width: 100%;
            height: 4px;
            background: rgba(100, 200, 255, 0.1);
            border-radius: 2px;
            margin-top: 6px;
            overflow: hidden;
        }

        .percentage-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff 0%, #0088ff 100%);
            border-radius: 2px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }

            .title {
                font-size: 24px;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">🔍 Solana Rug Checker</div>
            <div class="subtitle">Analyze token holder distribution</div>
        </div>

        <div class="input-group">
            <input type="text" id="tokenInput" placeholder="Enter token mint address" value="">
            <button onclick="checkToken()">Check</button>
        </div>

        <div id="error" class="error" style="display: none;"></div>
        <div id="loading" class="loading" style="display: none;"><div class="spinner"></div> Loading token data...</div>
        
        <div id="results" class="results">
            <div id="riskBadge"></div>
            <div class="stats">
                <div class="stat">
                    <div class="stat-label">Top Holder %</div>
                    <div class="stat-value" id="topHolder">-</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Top 10 %</div>
                    <div class="stat-value" id="top10">-</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Mint / Freeze Authority</div>
                    <div class="stat-value" id="authorities">-</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Risk Level</div>
                    <div class="stat-value" id="riskLevel">-</div>
                </div>
            </div>

            <div class="chart-container">
                <div id="chart"></div>
            </div>

            <div class="holders-list">
                <div class="holders-title">Top 15 Holders (% of supply)</div>
                <div id="holdersList"></div>
            </div>
        </div>
    </div>

    <script>
        async function checkToken() {
            const tokenInput = document.getElementById('tokenInput').value.trim();
            const errorDiv = document.getElementById('error');
            const loadingDiv = document.getElementById('loading');
            const resultsDiv = document.getElementById('results');

            errorDiv.style.display = 'none';
            resultsDiv.style.display = 'none';

            if (!tokenInput) {
                errorDiv.textContent = '❌ Please enter a token address.';
                errorDiv.style.display = 'flex';
                return;
            }

            loadingDiv.style.display = 'block';

            try {
                const response = await fetch(`/api/check-token?tokenAddress=${encodeURIComponent(tokenInput)}`);
                const data = await response.json().catch(() => ({}));

                if (!response.ok) {
                    throw new Error(data.error || `Request failed (${response.status})`);
                }

                displayResults(data);
            } catch (error) {
                loadingDiv.style.display = 'none';
                errorDiv.textContent = `❌ ${error.message}`;
                errorDiv.style.display = 'flex';
            }
        }

        function displayResults(data) {
            const loadingDiv = document.getElementById('loading');
            const resultsDiv = document.getElementById('results');

            loadingDiv.style.display = 'none';

            // Percentages are of total supply, computed server-side.
            const holdersWithPercent = data.holders || [];

            const topHolder = holdersWithPercent.length > 0 ? holdersWithPercent[0].percentage : 0;
            const top10 = holdersWithPercent.slice(0, 10).reduce((sum, h) => sum + h.percentage, 0);

            let riskLevel = 'LOW';
            let riskClass = 'risk-low';
            let riskEmoji = '🟢';

            if (topHolder > 70) {
                riskLevel = 'CRITICAL';
                riskClass = 'risk-critical';
                riskEmoji = '🔴';
            } else if (topHolder > 50) {
                riskLevel = 'HIGH';
                riskClass = 'risk-high';
                riskEmoji = '🟠';
            } else if (topHolder > 30) {
                riskLevel = 'MEDIUM';
                riskClass = 'risk-medium';
                riskEmoji = '🟡';
            } else if (topHolder > 15) {
                riskLevel = 'CAUTION';
                riskClass = 'risk-caution';
                riskEmoji = '🟡';
            }

            // An active mint or freeze authority lets the dev print tokens or freeze wallets.
            if ((data.mintAuthority || data.freezeAuthority) && (riskLevel === 'LOW' || riskLevel === 'CAUTION')) {
                riskLevel = 'MEDIUM';
                riskClass = 'risk-medium';
                riskEmoji = '🟡';
            }

            document.getElementById('topHolder').textContent = topHolder.toFixed(2) + '%';
            document.getElementById('top10').textContent = top10.toFixed(2) + '%';
            document.getElementById('authorities').textContent =
                `${data.mintAuthority ? '⚠️ On' : '✅ Off'} / ${data.freezeAuthority ? '⚠️ On' : '✅ Off'}`;
            document.getElementById('riskLevel').textContent = riskEmoji + ' ' + riskLevel;

            const riskBadge = document.getElementById('riskBadge');
            riskBadge.className = `risk-badge ${riskClass}`;
            riskBadge.textContent = `${riskEmoji} Risk Level: ${riskLevel}`;

            const top20Holders = holdersWithPercent.slice(0, 20);
            const bubbleTrace = {
                x: top20Holders.map((h, i) => i + 1),
                y: top20Holders.map(h => h.percentage),
                mode: 'markers',
                marker: {
                    size: top20Holders.map(h => Math.sqrt(h.percentage) * 3),
                    color: top20Holders.map(h => h.percentage),
                    colorscale: 'Viridis',
                    showscale: true,
                    colorbar: { title: '%' }
                },
                text: top20Holders.map((h, i) => `Holder ${i + 1}: ${h.percentage.toFixed(2)}%`),
                hoverinfo: 'text'
            };

            const layout = {
                title: 'Top 20 Holder Distribution',
                xaxis: { title: 'Holder Rank' },
                yaxis: { title: 'Percentage (%)' },
                plot_bgcolor: 'rgba(10, 20, 40, 0.5)',
                paper_bgcolor: 'rgba(10, 20, 40, 0)',
                font: { color: '#00d4ff' },
                margin: { l: 50, r: 50, t: 50, b: 50 }
            };

            Plotly.newPlot('chart', [bubbleTrace], layout, { responsive: true });

            const holdersListDiv = document.getElementById('holdersList');
            holdersListDiv.innerHTML = top20Holders.slice(0, 15).map((holder, idx) => `
                <div class="holder-item">
                    <div>
                        <div class="holder-address">${holder.owner.slice(0, 6)}...${holder.owner.slice(-6)}</div>
                        <div class="percentage-bar">
                            <div class="percentage-fill" style="width: ${Math.min(holder.percentage, 100)}%"></div>
                        </div>
                    </div>
                    <div class="holder-percentage">${holder.percentage.toFixed(2)}%</div>
                </div>
            `).join('');

            resultsDiv.style.display = 'block';
        }

        document.getElementById('tokenInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                checkToken();
            }
        });
    </script>
</body>
</html>
